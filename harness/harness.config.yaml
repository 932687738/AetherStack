version: 2

project:
  name: AetherStack
  language: java
  build_tool: maven
  framework: spring-boot

adapter: java-maven

index:
  claude_md: CLAUDE.md
  readme: README.md
  agents: AGENTS.md
  architecture: ARCHITECTURE.md
  design: harness/docs/DESIGN.md
  plans: harness/docs/PLANS.md
  doc_index: docs/INDEX.md

decomposition:
  max_files_per_plan: 15
  max_interactions_per_plan: 5

# 验证在关联仓库执行（见 .aetherstack/context/repos.yaml）
# 本地一键：make verify → verify-all.ps1
verify:
  loop_max: 3
  adapters:
    backend: java-maven
    frontend: frontend-npm
  steps:
    - name: full-verify
      command: "powershell -ExecutionPolicy Bypass -File .aetherstack/scripts/verify-all.ps1"
      note: orchestrates backend + frontend in linked repos
    - name: backend-test
      repo: backend
      command: "mvn -B -q test"
      adapter: java-maven
      verify_doc: harness/adapters/java-maven/verify-commands.md
    - name: backend-spring-ai-checks
      repo: governance
      command: ".aetherstack/scripts/check-spring-ai-tools.ps1 (+ rag, react-graph)"
      note: non-Strict warnings; use -Strict in completion-gate if required
    - name: frontend-lint
      repo: frontend
      command: "node scripts/harness.mjs lint"
      adapter: frontend-npm
      verify_doc: harness/adapters/frontend-npm/verify-commands.md
    - name: frontend-build-e2e
      repo: frontend
      command: "node scripts/harness.mjs build"
      note: max build + playwright (MOCK_CHAT=true)

agents:
  analyzer:
    name: hev-analyzer
    enabled: true
  coder:
    name: hev-coder
    enabled: true
  verifier:
    name: hev-verifier
    enabled: true

context:
  max_doc_lines: 500
  summary_on_complete: true
  utilization_warning: 0.4
  utilization_critical: 0.6

docs:
  plans: harness/docs/plans/
  archive: docs/archive/
  guides: docs/guides/
  database: docs/database/
  audits: docs/audits/

extensions:
  deploy: none
  push_strategy: manual
  deploy_trigger: none
  domain_knowledge: false
  maven_source_viewer: false

vendoring: project-local
repositories: .aetherstack/context/repos.yaml
