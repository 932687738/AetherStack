base_url: http://localhost:8080
proxy_dev: /api -> VITE_API_PROXY_TARGET (default http://localhost:8080)

endpoints:
  - method: POST
    path: /api/agent-hub/chat/knowledge
    description: 知识库模式流式对话 (SSE)
  - method: POST
    path: /api/agent-hub/chat/agent
    description: 存量 Agent Hub 智能体模式流式对话 (SSE)
    deprecated: true
    successor: POST /api/super-agents/chat
    sunset: "2026-12-31"
  - method: POST
    path: /api/super-agents/chat
    description: SuperAgents 平台智能体 SSE 对话（新）
    headers:
      - X-Tenant-Id
      - X-User-Id
      - X-User-Roles
    sse_events:
      plain: 默认纯文本 token 分片
      structured: '{"type":"token","text":"..."}' 或 '{"type":"progress",...}' 或 '{"type":"artifact","artifact":{...}}'（aether.platform.sse.structured-events=true）
      artifact_kinds: sql-review | table | code
  - method: POST
    path: /api/agent-hub/requirement-dev
    description: 需求开发模式 (SSE)
  - method: GET
    path: /api/agent-hub/status
    description: Agent Hub 运行时状态
  - method: POST
    path: /api/agent-hub/cli/invoke
    description: 同步唤起 Codex 或 Claude CLI（provider、prompt、可选 workingDirectoryRelative）
  - method: POST
    path: /api/agent-hub/knowledge/upload
    description: 文档上传
  - method: GET
    path: /api/agent-hub/knowledge-bases/{knowledgeBaseId}/documents
    description: 知识库文档列表
  - method: POST
    path: /api/agent-hub/knowledge/documents/batch-delete
    description: 批量删除文档
  - method: GET
    path: /api/agent-hub/knowledge-bases
    description: 知识库列表
  - method: GET
    path: /api/agent-hub/conversation-config/knowledge-retrieval-threshold
    description: 读取知识库对话检索阈值（相关度/向量相似度）
  - method: PUT
    path: /api/agent-hub/conversation-config/knowledge-retrieval-threshold
    description: 保存知识库对话检索阈值
  - method: GET
    path: /api/agent-hub/conversations
    description: 历史会话列表
  - method: POST
    path: /api/agent-hub/conversations
    description: 创建或更新会话元数据
  - method: GET
    path: /api/agent-hub/conversations/{conversationId}/messages
    description: 历史消息列表
  - method: POST
    path: /api/agent-hub/conversations/{conversationId}/messages
    description: 追加历史消息
  - method: PATCH
    path: /api/agent-hub/conversations/{conversationId}
    description: 重命名历史会话
  - method: DELETE
    path: /api/agent-hub/conversations/{conversationId}
    description: 删除历史会话
  - method: GET
    path: /api/super-agents/agents
    description: SuperAgents 注册表列表（Header X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/agents
    description: 注册子 Agent（Header X-Admin-Api-Key 保护写操作）
  - method: POST
    path: /api/super-agents/agents/{name}/health
    description: 探测 Agent 健康并更新状态
  - method: GET
    path: /api/super-agents/skills
    description: 列出租户 active Skill（Header X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/skills
    description: 发布 Skill 新版本（Header X-Admin-Api-Key）
  - method: PATCH
    path: /api/super-agents/skills/{name}/versions/{version}/status
    description: Skill 生命周期状态变更（Header X-Admin-Api-Key）
  - method: GET
    path: /api/super-agents/tools
    description: 平台与 Agent Hub Tool 描述摘要
  - method: GET
    path: /api/super-agents/model-providers
    description: ModelProvider 开关列表
  - method: PATCH
    path: /api/super-agents/model-providers/{providerId}
    description: 切换 ModelProvider 开关（Header X-Admin-Api-Key）
  - method: POST
    path: /api/super-agents/model-providers/refresh
    description: 重建 ModelProvider Port 绑定（Header X-Admin-Api-Key）
  - method: GET
    path: /api/super-agents/uncovered-intents
    description: 未覆盖意图列表（query limit，Header X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/mcp/refresh
    description: 刷新 MCP 外部工具缓存（Header X-Admin-Api-Key）
  - method: GET
    path: /api/super-agents/hooks/suspended
    description: 挂起工作流分页列表（query page/pageSize/keyword/status/skillName；Header X-Tenant-Id 可选）
  - method: GET
    path: /api/super-agents/hooks/suspended/{resumeToken}
    description: 挂起工作流详情（Header X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/hooks/suspended/{resumeToken}/close
    description: 关闭挂起工作流（Header X-Admin-Api-Key；X-Tenant-Id 可选）
  - method: DELETE
    path: /api/super-agents/hooks/suspended/{resumeToken}
    description: 删除 RESUMED/CLOSED 记录（Header X-Admin-Api-Key；X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/hooks/resume
    description: SSE 恢复挂起工作流（body resumeToken）
  - method: GET
    path: /api/super-agents/prompts/marketplace
    description: Prompt 市场列表（query category/keyword；Header X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/prompts/marketplace/favorites
    description: 收藏/取消收藏 Prompt 模板（body userId/templateId）
  - method: GET
    path: /api/super-agents/prompts/marketplace/favorites
    description: 用户收藏列表（query userId）
  - method: POST
    path: /api/super-agents/prompts/marketplace/use
    description: 选用模板写入 Agent system_prompt（body templateId/agentName）
  - method: POST
    path: /api/super-agents/prompts/marketplace/save-generated
    description: 保存 AI 生成 Prompt 为模板（body name/content/createdBy）
  - method: POST
    path: /api/super-agents/prompts/generate
    description: AI 辅助生成 Prompt（SSE；body description）
  - method: GET
    path: /api/agent-hub/flows
    description: AI 流程分页列表（query page/size/status/name；Header X-Tenant-Id 可选）
  - method: POST
    path: /api/agent-hub/flows
    description: 创建流程草稿（Header X-Admin-Api-Key；X-Tenant-Id 可选）
  - method: GET
    path: /api/agent-hub/flows/{id}
    description: 流程详情（Header X-Tenant-Id 可选）
  - method: PUT
    path: /api/agent-hub/flows/{id}
    description: 更新 definition 草稿（Header X-Admin-Api-Key）
  - method: DELETE
    path: /api/agent-hub/flows/{id}
    description: 软删除流程（Header X-Admin-Api-Key）
  - method: POST
    path: /api/agent-hub/flows/{id}/publish
    description: 发布流程 compile + 版本快照（Header X-Admin-Api-Key）
  - method: POST
    path: /api/agent-hub/flows/{id}/enable
    description: 启用流程（Header X-Admin-Api-Key）
  - method: POST
    path: /api/agent-hub/flows/{id}/disable
    description: 禁用流程（Header X-Admin-Api-Key）
  - method: GET
    path: /api/agent-hub/flows/{id}/versions
    description: 版本历史（Header X-Tenant-Id 可选）
  - method: POST
    path: /api/agent-hub/flows/{id}/rollback
    description: 回滚到指定版本（body versionNo；Header X-Admin-Api-Key）
  - method: POST
    path: /api/agent-hub/flows/{id}/invoke
    description: 同步执行流程（body params/conversationId；Header X-Tenant-Id 可选）
  - method: POST
    path: /api/agent-hub/flows/{id}/stream
    description: SSE 执行流程（flow_node_* 事件）
  - method: POST
    path: /api/agent-hub/flows/{id}/debug
    description: 设计器调试 SSE（Header X-Admin-Api-Key）
  - method: POST
    path: /api/agent-hub/flows/{id}/register-mcp-tool
    description: 注册流程为 MCP/Tool（Header X-Admin-Api-Key）
  - method: GET
    path: /api/agent-hub/flow-executions
    description: 执行记录分页（query page/size/flowId/status；Header X-Tenant-Id 可选）
  - method: GET
    path: /api/agent-hub/flow-executions/{executionId}
    description: 执行详情含 node_logs（Header X-Tenant-Id 可选）
  - method: GET
    path: /api/super-agents/agents/{name}/flow
    description: 查询 Agent 绑定流程（Header X-Tenant-Id 可选）
  - method: PUT
    path: /api/super-agents/agents/{name}/flow
    description: 绑定/解绑流程（body flowId，null 解绑；Header X-Admin-Api-Key）
  - method: GET
    path: /api/super-agents/agents/{agentName}/quick-commands
    description: 列出 Agent 快捷指令（Header X-Tenant-Id 可选）
  - method: POST
    path: /api/super-agents/agents/{agentName}/quick-commands
    description: 创建快捷指令（body name/content/icon）
  - method: PUT
    path: /api/super-agents/agents/{agentName}/quick-commands/{id}
    description: 更新快捷指令（body name/content/icon/version 乐观锁）
  - method: DELETE
    path: /api/super-agents/agents/{agentName}/quick-commands/{id}
    description: 删除快捷指令
  - note: super-agents-code-skills
    description: |
      代码 Skill（CompiledGraph）经 ReAct Tool 暴露，非独立 REST：
      executeCodeSkill(skillName, query, knowledgeBaseId, tenantId)、listCodeSkills()。
      内置 refund-policy-lookup（rag_retrieve → finalize_output）、order-insight（客服→分析串行）。
  - method: GET
    path: /swagger-ui.html
    description: API 文档
  - method: GET
    path: /springai/demo/alibaba-graph/human-loop/step1
    description: Graph 草稿 HIL step1
  - method: POST
    path: /springai/demo/alibaba-graph/human-loop/step2
    description: Graph 草稿 HIL step2
  - method: GET
    path: /springai/demo/alibaba-graph/human-loop/tool-feedback/invoke
    description: 工具审批 invoke
  - method: POST
    path: /springai/demo/alibaba-graph/human-loop/tool-feedback/resume
    description: 工具审批 resume
  - method: POST
    path: /springai/demo/alibaba-graph/human-loop/tool-feedback/resume/approve
    description: 工具审批快捷批准
  - method: POST
    path: /springai/demo/alibaba-graph/human-loop/tool-feedback/resume/reject
    description: 工具审批快捷拒绝
  - method: POST
    path: /springai/demo/alibaba-graph/human-loop/tool-feedback/resume/edit
    description: 工具审批快捷改参
  - method: GET
    path: /springai/demo/alibaba-graph/human-loop/enterprise/contract-review
    description: 企业工作流合同审核
  - method: GET
    path: /springai/demo/alibaba-graph/human-loop/enterprise/ecommerce-cs
    description: 企业工作流电商客服
  - method: GET
    path: /springai/demo/alibaba-graph/human-loop/enterprise/publishing/step1
    description: 自媒体发布 step1
  - method: POST
    path: /springai/demo/alibaba-graph/human-loop/enterprise/publishing/step2
    description: 自媒体发布 step2

