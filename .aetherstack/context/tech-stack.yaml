backend:
  language: Java 17
  build: Maven
  framework: Spring Boot 3.4.3
  ai: Spring AI 1.1.2, Spring AI Alibaba 1.1.2.2
  orm: MyBatis
  migration: Flyway
  database: PostgreSQL 16 + pgvector
  api_doc: springdoc-openapi /swagger-ui.html

spring_ai_alibaba:
  default_orchestration:
    - CompiledGraph
    - ReactAgent
  when_optional: 单次 ChatClient、纯 CRUD、纯向量检索、存量 Orchestrator 小改
  rule: .aetherstack/rules/backend-ai.md
  design_guide: openspec/references/backend-design-guide.md
  production_paths:
    knowledge_hub: knowledgehub/graph (CompiledGraph)
    agent_hub: agents OrchestratorAgent (legacy, migrate to Graph/ReactAgent)
  references:
    compiled_graph: [knowledgehub/graph, springai/graph]
    react_agent: [springai/agent, springai/projectpractice/recommendedpackaging]
    ddd_template: springai/projectpractice/recommendedpackaging

frontend:
  language: TypeScript
  build: Umi 4 (harness CLI)
  framework: React 18
  ui: Ant Design 5
  state: Zustand
  server_cache: TanStack Query
  openapi: src/openapi/ (generated)
  lint: ESLint + Stylelint + Prettier
  legacy_note: "部分模块仍为 Vite 8 + JS，见 frontend-umi-standards.md §8"
  standards: openspec/references/frontend-umi-standards.md

infrastructure:
  compose: docker-compose.yml
  db_image: pgvector/pgvector:pg16
  db_name: agenthub
  db_port: 5432

env_required:
  backend:
    - DASHSCOPE_API_KEY
    - POSTGRES_JDBC_URL
    - POSTGRES_USERNAME
    - POSTGRES_PASSWORD
  frontend:
    - UMI_APP_* 或项目 .env 约定（禁止硬编码 API 基址）
