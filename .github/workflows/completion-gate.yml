name: Completion Gate

on:
  pull_request:
    paths:
      - 'openspec/changes/**'
      - '.aetherstack/scripts/completion-gate.ps1'
      - '.aetherstack/scripts/check-*.ps1'
      - '.aetherstack/scripts/verify-all.ps1'
  workflow_dispatch:
    inputs:
      change:
        description: 'OpenSpec change id (folder under openspec/changes, not archive)'
        required: true
        type: string
      skip_verify:
        description: 'Skip make verify (smoke gate only)'
        required: false
        default: true
        type: boolean

jobs:
  completion-gate:
    name: completion-gate
    if: vars.COMPLETION_GATE_ENABLED != 'false'
    runs-on: ${{ vars.AETHER_SELF_HOSTED == 'true' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout linked repos (optional)
        if: vars.CHECKOUT_LINKED_REPOS == 'true'
        shell: pwsh
        env:
          AETHER_AI_REPOSITORY: ${{ vars.AETHER_AI_REPOSITORY }}
          AETHER_FRONTEND_REPOSITORY: ${{ vars.AETHER_FRONTEND_REPOSITORY }}
          AETHER_LINKED_REF: ${{ vars.AETHER_LINKED_REF }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: ./.aetherstack/scripts/setup-linked-repos-ci.ps1

      - name: Resolve change id
        id: change
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.change }}" ]; then
            echo "id=${{ github.event.inputs.change }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t dirs < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
            | grep '^openspec/changes/' \
            | grep -v '^openspec/changes/archive/' \
            | cut -d/ -f3 | sort -u)
          if [ "${#dirs[@]}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#dirs[@]}" -gt 1 ]; then
            echo "::error::Multiple active changes in PR: ${dirs[*]}. Use workflow_dispatch with change input."
            exit 1
          fi
          echo "id=${dirs[0]}" >> "$GITHUB_OUTPUT"

      - name: Skip when no active change
        if: steps.change.outputs.skip == 'true'
        run: echo "No active OpenSpec change in PR paths; skipping gate."

      - name: Run completion-gate
        if: steps.change.outputs.skip != 'true'
        shell: pwsh
        env:
          AETHER_BACKEND_REPO: ${{ env.AETHER_BACKEND_REPO }}
          AETHER_FRONTEND_REPO: ${{ env.AETHER_FRONTEND_REPO }}
        run: |
          $change = '${{ steps.change.outputs.id }}'
          $inputSkip = '${{ github.event.inputs.skip_verify }}' -eq 'true'
          $fullByVar = '${{ vars.COMPLETION_GATE_FULL_VERIFY }}' -eq 'true'
          $linked = ./.aetherstack/scripts/check-linked-repos.ps1 | ConvertFrom-Json
          $runFull = (-not $inputSkip) -and ($fullByVar -or $linked.bothAvailable)
          if ($runFull) {
            Write-Host "Running completion-gate WITH verify (linked=$($linked.bothAvailable), fullVar=$fullByVar)"
            ./.aetherstack/scripts/completion-gate.ps1 -Change $change
          } else {
            Write-Host "Running completion-gate SkipVerify (inputSkip=$inputSkip, linked=$($linked.bothAvailable))"
            ./.aetherstack/scripts/completion-gate.ps1 -Change $change -SkipVerify
          }

      - name: Upload gate artifact
        if: steps.change.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: completion-gate-${{ steps.change.outputs.id }}
          path: openspec/changes/${{ steps.change.outputs.id }}/.completion-gate.json
          if-no-files-found: warn
