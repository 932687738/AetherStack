name: standard-spec-driven
version: 1
description: QWMS workflow - proposal → specs → (design-draft if complex) → design → design-review (brainstorming) → test-cases → tasks → apply
artifacts:
  - id: proposal
    generates: proposal.md
    description: 变更提案（中文）
    template: proposal.md
    instruction: |
      创建 proposal.md（中文），明确为什么要做、做什么、影响什么。

      必读参考：
      - openspec/config.yaml（项目约束与规则摘要）
      - openspec/references/qwms-rules.md（命名与影响分析要求）

      范围要求（只做“概要描述”）：
      - 说明背景/目标/范围（Why / What）
      - Capabilities 只列出“需求层面有变化”的能力（命名规则见 qwms-rules）
      - 简洁清晰（1-2 页为宜）

      影响分析：
      - proposal 仅简述影响，完整 Impact 清单放在 design.md（系统清单见 openspec/references/architecture.md）
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: 业务规范（双层结构）
    template: spec.md
    instruction: |
      创建 spec 增量文件（中文）。每个 capability 一份。

      必须遵循 QWMS 结构规范，包含：
      1. ## 一、OpenSpec 需求（前提/操作/结果）
      2. ## ADDED/MODIFIED/REMOVED/RENAMED Requirements

      关键规则：
      - Delta 标题必须使用英文：`## ADDED/MODIFIED/REMOVED/RENAMED Requirements`
      - Requirement 标题格式：`### Requirement: 1. 标题`
      - 场景采用兼容写法：`#### 场景: 场景名称`
      - 场景内容使用中文“前提/操作/结果”
      - 场景必须使用 `#### 场景:`（4 个 #），否则解析失败
      - 场景使用“前提/操作/结果”（语义等同 GIVEN/WHEN/THEN）
      - Requirement 之间用 `---` 分隔
      - 必须包含锚点：`<a name="req-X"></a>` 与 `<a name="openspec-req-X"></a>`
      - ADDED Requirements 章节可写中文标题（如“新增用户故事”），但需保留 ADDED/MODIFIED/REMOVED/RENAMED 语义

      Delta 使用规则：
      - ADDED：新增需求
      - MODIFIED：修改行为（需完整粘贴原 Requirement 块再修改）
      - REMOVED：删除需求（必须包含 Reason/Migration）
      - RENAMED：仅名称变化（FROM/TO）

      语义规范：
      - 使用业务语言，避免技术细节（类名/表名/方法名）
      - 覆盖 PRD 全部章节，避免遗漏
      - 需求数量建议 5-10 个，超过需考虑拆分
      - spec.md = 业务/产品定义；设计实现放 design.md

      主/子能力规则：
      - 主能力需完整背景与目标 + 完整 mindmap
      - 子能力可 1-2 句简写并引用 proposal 或主能力 spec
      - 子能力 mindmap 可仅画相关节点，或引用主能力 mindmap

      粒度规则：
      - Requirement 按“用户故事”粒度拆分（目标即 1 条 Requirement）
      - 规则/校验类内容归入对应用户故事的 Scenario
      
      分组规则：
      - 需要按“功能组”对 Requirements 分段组织（使用 `### 功能组 X：名称`）
    requires:
      - proposal

  - id: design
    generates: design.md
    description: 技术设计（概要 + 详细）
    template: design.md
    instruction: |
      生成 design.md（中文，技术方案）。

      【强制】代码准确性要求：
      - 现状代码必须从实际代码文件中读取，不能凭空编写
      - 代码位置必须通过实际代码追踪确认
      - 如果无法确认代码位置，必须先停下来询问
      - 改造要点必须基于实际代码，不能猜测
      - 必须遵循 openspec/references/engineering-standards.md 的工程规范

      复杂度检查（proposal + spec 完成后必须做）：
      - ≥2 个领域
      - 新外部依赖
      - MQ/缓存/定时任务/新增表
      - Requirement ≥8 或 Scenario ≥12

      若"复杂"：
      - 必须先生成 design-draft.md（整体方案），模板见 openspec/schemas/standard-spec-driven/templates/design-draft.md
      - 输出三选一提示（A 自己写 / B AI 起草 / C 跳过 draft）并等待用户选择
      - 未获得明确选择不得直接生成 design.md

      若"简单"：
      - 直接生成 design.md，但必须先阅读 openspec/schemas/standard-spec-driven/templates/design.md

      design.md 章节必须严格按模板顺序：
      一. 概述 → 二. 业务分析 → 三. 系统设计 → 四. 详细设计 → 五. 接口设计 → 六. 代码改造分析 → 七. 非功能性需求

      关键要求：
      - 基于 draft 的技术决策，不擅自修改
      - 明确阶段准入、批量/失败策略、关键数据落点、日志事件与外部反馈口径，避免 test-cases 补定义
      - 补充完整 DDL、接口 JSON、错误码、时序图
      - 涉及 `gwms-domain-share` / `gwms-generic` 需评估兼容性与测试覆盖；前者重点关注跨微服务共享边界与纯领域约束，后者重点关注共享基础设施/辅助能力复用影响

      【UI-Craft】读取 `.openspec.yaml` 的 `uiCraftMode`（或 0.1 默认 auto）：
      - `enabled` 或 auto 判定有 U1 界面时，design 必须含「前端 UI 界面清单」表格（路径、UI-CRAFT/UI-FUNC/UI-AUDIT、说明），见 `openspec/references/ui-craft-standards.md`
      - 纯后端变更可声明「无 U1 界面」并设 `uiCraftMode: disabled`

      design.md 初稿完成后 **不得** 直接进入 test-cases / tasks；须先完成 `design-review` 工件（见下一 artifact）。
    requires:
      - proposal
      - specs

  - id: design-review
    generates: design-review.md
    description: 设计审查（Superpowers brainstorming）
    template: design-review.md
    instruction: |
      【强制】standard-spec-driven 专属：在 design.md 完成后、进入 test-cases / tasks 前，必须对本设计进行 brainstorming 审查。

      ## 触发与前置

      - 依赖 `design.md` 已生成（含 design-draft 路径下的终稿）
      - 未安装 obra Superpowers 时提示：`/add-plugin superpowers`
      - **必须 invoke** 插件 skill `brainstorming`（非 Cursor 环境读取 GitHub 同名 skill）

      ## 必读输入

      - `proposal.md`
      - `specs/**/spec.md`
      - `design.md`
      - `openspec/references/aether-rules.md` §5（design 约束）、§5.11（Spring AI 铁三角，如适用）
      - `openspec/references/engineering-standards.md`
      - AI 相关：`backend-design-guide.md` 与铁三角 standards（如 design 触及 LLM/Agent/RAG/Graph）

      ## 审查方式（brainstorming）

      以「设计审查」模式 invoke `brainstorming`：对现有 design.md 做批判性审视，**不是**重新头脑风暴新方案。重点：

      1. **需求对齐**：design 是否覆盖全部 Requirement/Scenario；有无遗漏或擅自扩 scope
      2. **架构分层**：四层边界、聚合入口、事务边界、跨聚合事件是否清晰
      3. **接口契约**：与 `integration-contracts.md`、错误码、幂等/批量语义是否一致
      4. **非功能**：可观测性清单、并发/幂等/性能口径、Assumptions 是否完整（aether-rules §5）
      5. **Spring AI**（如适用）：选型理由、铁三角 checklist、禁止手写编排扩大
      6. **风险与备选**：技术债务、回滚/降级、未决口径是否显式标记

      ## 产出

      - 生成 `design-review.md`（模板见 `openspec/schemas/standard-spec-driven/templates/design-review.md`）
      - 每条发现标注 ID（DR-xx）、严重度（阻塞 / 建议）
      - **阻塞项**：须修订 `design.md` 并在「design.md 修订记录」中回填；阻塞清零前 Status 保持 `Draft`
      - **建议项**：可记录采纳/豁免理由；不阻断进入下一阶段

      ## 模式评估（与 design 完成后检查点联动）

      审查同时执行（并在 design-review 中简要记录结论）：
      - `aiTddMode: auto` → 是否触及 L1；触及则更新 `.openspec.yaml` 为 `enabled`
      - `uiCraftMode: auto` → 是否触及 U1；触及则更新 `.openspec.yaml` 为 `enabled`，并确认 design 含 UI 界面清单

      ## 用户确认（强制）

      完成后主动列出：总体结论、阻塞项、已修订章节、待用户确认项。话术示例：

      ```
      ✅ design-review.md 已生成（brainstorming 审查完成），请确认：

      【总体结论】有条件通过 / 通过 / 需修订
      【阻塞项】共 N 条（须清零后 Status → Reviewed）
      【design.md 已修订章节】…

      确认无误请回复「确认 design-review」，我将 Status 改为 Reviewed 并继续 test-cases / tasks。
      ```

      - 收到用户确认且阻塞项已处理后，将 `Status` 改为 `Reviewed`
      - **Status 非 Reviewed 时**，不得生成或推进 test-cases / tasks
    requires:
      - design

  - id: test-cases
    generates: test-cases.md
    description: 测试用例（独立文件，由测试同学提供）
    template: test-cases.md
    instruction: |
      test-cases.md 由测试同学提供，AI 不主动生成用例内容。

      ## 触发条件

      仅当用户明确说”测试同学已提供 testcase”或直接粘贴/上传测试用例内容时，才进入本步骤。
      若用户未提供，必须停下并提示：
      “test-cases.md 需由测试同学提供，请将测试用例内容粘贴到对话中，或告知测试稿文件路径后继续。”

      ## AI 执行内容（仅做格式对齐，不生成用例）

      ### Step 1：接收输入
      - 接收测试同学提供的测试用例（粘贴内容 / 文件路径）
      - 读取 spec.md 和 design.md，用于 Requirement 追溯和 AUTO-UT 标记判断

      ### Step 2：格式规范化
      将测试同学的用例转换为 `[S]/[C]` 标准格式：
      - 补充 `[S]` 场景包分组（按业务主题，若原稿已有分组则保留）
      - 补充 `[C]` 用例编号（TC-REQx-yy，若原稿已有编号则保留）
      - 补充 Requirement 追溯标注（对照 spec.md）
      - **不得修改用例内容、步骤、预期结果**；仅做结构对齐

      ### Step 3：AUTO-UT / AUTO-AI-UT 标记
      对每条 `[C]` 判断并标注 `Automation`：
      - `AUTO-UT`：可在后端 Service 层稳定验证（规则校验/边界/异常/幂等/防重），无强环境依赖；命中”校验/阻断/拒绝/默认值/分流/状态判断/数量计算/幂等/防重”时默认 `AUTO-UT`
      - `MANUAL`：页面交互/跨系统联调/强数据环境依赖；必须补 `ManualReason` 说明原因
      - `AUTO-AI-UT`：`aiTddMode: enabled` 或 auto 命中 L1 且覆盖 AI 核心逻辑时 **必须**（见 `openspec/references/ai-tdd-standards.md`）
      - `AUTO-AI-IT`：复杂 RAG/Graph 集成（推荐）
      - 标记依据来自 spec.md 和 design.md，不得擅自修改测试同学的场景意图

      ### Step 3.5：AI-TDD 模式（`.openspec.yaml` → `aiTddMode`）
      - `enabled` / auto 命中 L1 → L1 用例须含 `AUTO-AI-UT`
      - `disabled` → 不强制 `AUTO-AI-UT`

      ### Step 4：冲突标记
      对比 spec.md / design.md，若发现用例与设计存在口径冲突：
      - **不得修改用例内容**
      - 在用例末尾标注 `⚠️ 待确认：[冲突描述]`
      - 汇总到文件末尾的”口径冲突清单”

      ### Step 5：输出与确认提示
      - `Source` 填写 `测试同学提供`
      - `Status` 固定为 `Draft`
      - 完成后**主动列出需要测试同学确认的项**，格式如下：

        ```
        ✅ test-cases.md 格式对齐完成，请确认以下内容：

        【AUTO-AI-UT 标记清单】（AI-TDD 开启时，共 N 条，L1 模块必须先测后码）
        - TC-REQ1-03：[用例名称] → AUTO-AI-UT

        【AUTO-UT 标记清单】（共 N 条，请确认是否可不依赖真实环境验证）
        - TC-REQ1-02：[用例名称] → AUTO-UT
        - TC-REQ2-01：[用例名称] → AUTO-UT
        ...

        【口径冲突清单】（共 M 条，请与开发对齐后补充结论）
        - TC-REQ3-01：[冲突描述]
        ...（无冲突则写”无”）

        确认无误后请回复”确认”，或指出需要修正的条目，AI 将更新后把 Status 改为 Reviewed。
        ```

      - 收到测试同学确认（或修正）后，更新对应标记，将 `Status` 改为 `Reviewed`

      ## 产出结构
      1. 测试基线来源（必填，Source / OpenSpec 基线 / Status）
      2. 用例主体（`[S]/[C]` 可导入格式，正文主体）
      3. 口径冲突清单（按需，仅在用例与 spec/design 存在冲突时填写）
    requires:
      - specs
      - design
      - design-review

  - id: tasks
    generates: tasks.md
    description: 实施任务清单
    template: tasks.md
    instruction: |
      创建 tasks.md（中文），每个任务必须可验证。

      任务拆分原则（强制）：
      - 输出物导向：每个任务是用户可感知的业务交付物
      - 粒度控制：1 个任务 ≈ 1 个 Requirement 或独立子功能（参考 spec.md）
      - 覆盖后端 + 前端 + 测试 + 依赖 + 可验证输出
      - 标注依赖关系，支持并行

      测试任务占位规则（强制）：
      - 测试任务（1.3～1.6）在 tasks 生成时先占位，不等 test-cases 就绪
      - 占位格式：`- [ ] x.3 测试任务（待 test-cases Reviewed 后补充）`

      AI 生成 tasks.md 的强制步骤：
      1) 重新阅读 spec.md，列出所有 Requirements
      2) 按 Requirement 分组拆分开发任务（后端 + 前端）
      3) 每个 Requirement 补充测试任务占位（1.3～1.6）
      4) 每个任务包含”可验证输出”描述
      5) 前端任务标注 UI 类型（UI-CRAFT / UI-AUDIT / UI-FUNC）；`uiCraftMode: enabled` 时 U1 须含 `1.2a` Impeccable 任务（见 ui-craft-standards.md）
    requires:
      - specs
      - design
      - design-review

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    逐项执行 tasks.md，完成后勾选 `- [x]`。

    【强制】Harness 接线（/opsx-apply 同源）：
    - 必读 `.cursor/skills/harness-apply/SKILL.md`
    - 每个实现类 task：hev-analyzer → hev-coder → hev-verifier（scoped 验证通过后再勾选）
    - 全部 task 完成或会话结束前：Superpowers `verification-before-completion` → `/opsx-verify`（`verification-report.md`）→ `cr` → `make completion-gate CHANGE=<id>`（见 `openspec/references/completion-gate.md`）
    - AUTO-UT/AUTO-AI-UT 勾选任务须含 `trace: TC-REQ…`；U1 勾选须含 `impeccable:`

    【强制】编码前验证：
    - 通读 proposal.md、specs/ 下相关 spec.md 与 design.md 的对应章节
    - 确认 `design-review.md` 存在且 `Status: Reviewed`（standard-spec-driven 门禁）
    - 读取 `.openspec.yaml` 的 `aiTddMode`；`enabled` 或 auto 命中 L1 时必读 `openspec/references/ai-tdd-standards.md`
    - 对 `AUTO-UT` 任务，先读取 `test-cases.md` 中对应 `[C]` 用例，再定位代码写单测
    - 对 `AUTO-AI-UT` 任务：**必须先写/补 `*Test.java` 再改 L1 生产代码**；invoke obra Superpowers `test-driven-development`，并遵循 `.aetherstack/rules/ai-tdd.md` 与 `harness/adapters/java-maven/ai-test-templates.md`
    - 后端单测 invoke obra Superpowers `test-driven-development`，并遵循 `.aetherstack/rules/superpowers.md` 与 `harness/adapters/java-maven/test-templates.md`
    - 执行前先读取 design.md 中提到的代码文件
    - 验证代码位置和代码片段是否与实际一致
    - 如果不一致，先更新 design.md，再执行
    - 不能盲目相信设计文档，必须以实际代码为准
    - 对齐 openspec/references/engineering-standards.md（分层/校验/DTO/缓存/DB）
    - 对 `AUTO-UT` / `AUTO-AI-UT` 任务，勾选前必须执行对应测试命令并通过
    - `AUTO-AI-UT` 未完成时 **不得** 勾选对应 L1 实现任务

    【UI-Craft 前端】（读取 `.openspec.yaml` 的 `uiCraftMode`）：
    - `enabled` 或 auto 命中 U1：必读 `openspec/references/ui-craft-standards.md` 与 `.cursor/skills/impeccable/SKILL.md`
    - `UI-CRAFT` 任务：shape → craft（或 audit → 修复 → polish）
    - `UI-AUDIT` 任务：audit/critique → polish
    - `UI-FUNC` 任务：仅 ai_react 逻辑/API，不要求 Impeccable
    - U1 未完成 Impeccable 验收 **不得** 勾选对应前端实现任务
    - 前端验收：`npm run lint` + `npm run build`（在 ai_react 仓库）

    【占位任务处理】：
    - 遇到 `待 test-cases Reviewed 后补充` 的占位任务时，先检查 test-cases.md 的 Status
    - Status: Reviewed：读取 AUTO-UT 用例，定位代码，写单测，跑命令
    - Status: Draft 或文件不存在：跳过，继续执行其他任务，最后提示"以下测试任务待 test-cases Reviewed 后补充：[列出任务编号]"

    【强制】输出对齐清单（每项 1 句，简洁说明）：
    1) 需求对齐（specs）
    2) 方案概述（design）
    3) 代码改造分析（design）
    4) 接口契约（design，如无变更写”无”）
    5) 边界与异常（design）
    6) 影响范围（design）
    7) 系统/详细设计（design，如无变更写”无”）
    8) 测试用例对齐（test-cases；若 test-cases.md 尚未就绪写”待补”）
    9) 工程规范对齐（engineering-standards）
    10) 单测执行结果（`AUTO-UT` / `AUTO-AI-UT`；若测试任务尚未执行写”待补”）
    11) AI-TDD 对齐（aiTddMode 与 L1 模块；disabled 写”不适用”）
    12) UI-Craft 对齐（uiCraftMode、U1 界面与 Impeccable 命令；disabled 写”不适用”）

    遇到阻塞或不明确处先停下询问。
